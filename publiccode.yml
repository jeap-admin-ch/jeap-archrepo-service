description:
  en:
    localisedName: jeap-archrepo-service
    shortDescription: >
      Library that provides a centralized architecture inventory through REST APIs for use by the jEAP Doc Service.
    longDescription: >
      The jEAP Architecture Repository Service (Arch Repo) is a central architecture repository holding the 
      architecture model for documenting components and their relations in a microservice-based system architecture.
      It maintains an up-to-date inventory of microservices, their relationships, events, and interfaces, and exposes
      the resulting architecture model through REST APIs, including an OAuth2-protected Docs API consumed by the jEAP
      Doc Service. The Doc Service generates the architecture documentation. A service instance can be created by
      depending on this library, then adding specific configuration.
    features:
      - Maintains an up-to-date inventory of microservices, relationships, and interfaces
      - Integrates multiple data sources into an architecture inventory
      - Exposes the architecture model to the jEAP Doc Service
