server:
  # A fixed port, because the JWKS URI below has to name it and is bound before the web server starts. Unlikely
  # to collide, and an instance whose build occupies it can override server.port on its own test class.
  port: 18899
  servlet:
    context-path: /${spring.application.name}

jeap.web.tls.enabled: false

spring:
  application:
    name: applicationplatform-archrepo-service
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # url, username and password come from the PostgreSQL container - see PactProviderTestBase
    hikari:
      schema: data
  flyway:
    locations: classpath:db/migration/common
    # Flyway creates automatically the default schema if it doesn't exist
    default-schema: data
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: data

archrepo:
  openapi-base-url: "https://base-url"
  update-schedule: "-"
  api:
    secret: "{noop}secret"
  documentation-generator:
    update-schedule: "-"
    space-key: "FOO"
    root-page-name: "BAR"
    confluence:
      url: "https://foo.bar"
      space-key: "ARCDOCTEST"
      root-page-id: "123456"
      username: "ezv-archrepo-techuser"
      password: "PASSWORD"
      mock-confluence-client: true

pactbroker:
  url: "https://foo.bar"

jeap:
  security:
    oauth2:
      resourceserver:
        # Required: the docs API authorizes every resource with a semantic role, which the jEAP security starter
        # only activates when the system name is configured.
        system-name: "application-platform"
        # The docs API is bearer-authenticated, so a verification of it has to present a token this application
        # accepts. The issuer is the test issuer of jeap-spring-boot-security-starter-test (JwsBuilder
        # .DEFAULT_ISSUER) and the keys are served by the JWKS endpoint mock this application itself carries
        # under this profile - see PactProviderTestBase, which signs one token per interaction against them.
        authorization-server:
          issuer: "http://localhost/auth"
          jwk-set-uri: "http://localhost:18899/applicationplatform-archrepo-service/.well-known/jwks.json"
archrepo-config:
  environment: dev

