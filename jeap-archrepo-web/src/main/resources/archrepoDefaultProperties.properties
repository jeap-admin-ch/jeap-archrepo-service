spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
spring.jpa.properties.hibernate.default_schema=data
# The architecture model is one deep object graph and every read of it traverses many collections at once, so
# without batching Hibernate loads them one owning row at a time - one round trip per relation, per REST API, per
# message. The queries are trivial and the database is idle; the cost is pure latency, and it is what made
# GET /docs-api/systems/{system} take seconds. Batched, those loads collapse into one query per hundred rows.
# An instance may override this, but there is no reason to lower it.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/please-set-db-url
spring.datasource.tomcat.jmx-enabled=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name="hikari-cp-${spring.application.name}"
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.default-schema=data
spring.thymeleaf.check-template-location=false
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.max-file-size=20MB
springdoc.swaggerUi.queryConfigEnabled=true
